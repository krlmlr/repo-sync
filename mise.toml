[tools]
python = "3.11"

[tasks.install]
description = "Install Python dependencies"
run = "pip install -r requirements.txt"

[tasks.fetch-inventory]
description = "Fetch branch list from krlmlr/actions-sync and write repos.yml"
depends = ["install"]
run = "python3 scripts/fetch_inventory.py"

# Prerequisites for both tasks below:
#
# SSH access to GitHub -- a key the account knows, reachable by the agent, and
# github.com in `known_hosts` so the first connection has nothing to ask about.
# The scripts clone with `git` over SSH and never call the GitHub API, so there
# is no `gh` login to keep and no rate limit to spend.
#
# perl, for the `prepare-commit-msg` hook the mirrors are pointed at. It is on
# every machine that has the rest of this, and the hook refuses a commit it
# cannot check rather than waving it through, so its absence is loud.
#
# GNU parallel (`apt install parallel`, `brew install parallel`) -- and that one
# specifically, since moreutils ships an unrelated program under the same name.
# The repositories are mirrored several at a time; `REPO_SYNC_JOBS` says how
# many, defaulting to 8, and `REPO_SYNC_JOBS=1` puts a run back in single file
# when a failure needs reading.
[tasks.clone]
description = "Clone or update every repo in repos.yml into mirrors/<org>/<repo>/"
run = "bash scripts/clone.sh"

# The sweep that `s` cannot do: it finds repositories by their `.git` entry,
# which the template's bare mirror does not have.
[tasks.sync]
description = "Fetch the bare template mirror, pull --rebase every mirror, fetch `template` everywhere"
depends = ["install"]
run = "bash scripts/sync.sh"
